[project]
name = "anime-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Vasiliy Mozhaev", email = "mozhay2005@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["aiofiles>=25.1.0"]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.9",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "Q", "I", "RUF", "FAST"]

[tool.ruff]
line-length = 120
